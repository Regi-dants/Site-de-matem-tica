<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../css/botaovoltar.css" type="text/css" rel="stylesheet">
    <link href="../../css/style-quiz.css" type="text/css" rel="stylesheet">
    <link href="../css/notificacao-conquista.css" type="text/css" rel="stylesheet">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</head>

<body>

    <a href="../quiz.html" class="btn-voltar-fixo">
        🏠 Voltar para o Menu
    </a>

    <h2>Quiz de PA e PG</h2>
    <header id="quiz-container">

        <div class="question"></div>

        <button id="btn-corrijir" onclick="corrigir()">Corrigir</button>


        <div id="resultado"></div>
        <div id="correcao"></div>

    </header>
    <div id="notificacao-conquista" class="notificacao-conquista">
        <img id="emblema-notificacao" src="" alt="Emblema da conquista">

        <div class="notificacao-texto">
            <h3>Conquista Desbloqueada!</h3>
            <p>Uma nova conquista foi liberada.</p>
        </div>
    </div>
    <script src="../../javaScript/quiz/PA e PG.js"></script>
    <script src="../../javaScript/criar-perguntas.js"></script>
    <script src="../../javaScript/salvar/salvamento-automatico.js"></script>
    <script src="../../javaScript/recursos/conquistas.js"></script>
    <script src="../../javaScript/corrijir.js"></script>
    <script src="../javaScript/recursos/notificaçao.js"></script>


</body>

</html>
